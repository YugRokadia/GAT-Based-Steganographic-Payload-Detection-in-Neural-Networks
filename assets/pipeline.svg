<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" role="img" aria-labelledby="t d">
  <title id="t">Detection pipeline</title>
  <desc id="d">CIFAR-10 to 60 plus CNNs to payload injection to 22 byte-level features to a Graph Attention Network to a clean or tampered verdict.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#120b24"/><stop offset="1" stop-color="#241447"/></linearGradient><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c4b5fd"/></marker></defs>
  <style>
    .t{font-family:'Segoe UI',-apple-system,'Helvetica Neue',Arial,sans-serif}
    .m{font-family:SFMono-Regular,Consolas,Menlo,'DejaVu Sans Mono',monospace}
    @keyframes flow{to{stroke-dashoffset:-24}}
    .fl{stroke-dasharray:6 6;animation:flow 1s linear infinite}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    .pu{animation:pulse 2.4s ease-in-out infinite}.p2{animation-delay:-.8s}.p3{animation-delay:-1.6s}
    @media (prefers-reduced-motion:reduce){.fl,.pu{animation:none;opacity:1}}
  </style>
  <rect width="1000" height="250" rx="22" fill="url(#bg)"/>
  <text class="t" x="40" y="46" font-size="13" font-weight="600" letter-spacing="3" fill="#c4b5fd">THE PIPELINE</text>
  <rect x="16" y="86" width="138" height="86" rx="14" fill="#1c1138" stroke="#22d3ee" stroke-opacity=".7"/><text class="t" x="85.0" y="124" font-size="15" font-weight="700" fill="#f1eaff" text-anchor="middle">CIFAR-10</text><text class="t" x="85.0" y="148" font-size="12.5" fill="#b9a9d9" text-anchor="middle">image dataset</text><rect x="182" y="86" width="138" height="86" rx="14" fill="#1c1138" stroke="#a78bfa" stroke-opacity=".7"/><text class="t" x="251.0" y="124" font-size="15" font-weight="700" fill="#f1eaff" text-anchor="middle">60+ CNNs</text><text class="t" x="251.0" y="148" font-size="12.5" fill="#b9a9d9" text-anchor="middle">trained models</text><rect x="348" y="86" width="138" height="86" rx="14" fill="#1c1138" stroke="#f472b6" stroke-opacity=".7"/><text class="t" x="417.0" y="124" font-size="15" font-weight="700" fill="#f1eaff" text-anchor="middle">Inject payloads</text><text class="t" x="417.0" y="148" font-size="12.5" fill="#b9a9d9" text-anchor="middle">tamper weights</text><rect x="514" y="86" width="138" height="86" rx="14" fill="#1c1138" stroke="#fbbf24" stroke-opacity=".7"/><text class="t" x="583.0" y="124" font-size="15" font-weight="700" fill="#f1eaff" text-anchor="middle">22 features</text><text class="t" x="583.0" y="148" font-size="12.5" fill="#b9a9d9" text-anchor="middle">byte-level stats</text><rect x="680" y="86" width="138" height="86" rx="14" fill="#1c1138" stroke="#c4b5fd" stroke-opacity=".7"/><text class="t" x="749.0" y="124" font-size="15" font-weight="700" fill="#f1eaff" text-anchor="middle">Graph Attention</text><text class="t" x="749.0" y="148" font-size="12.5" fill="#b9a9d9" text-anchor="middle">Network (GAT)</text><rect x="846" y="86" width="138" height="86" rx="14" fill="#1c1138" stroke="#34d399" stroke-opacity=".7"/><text class="t" x="915.0" y="124" font-size="15" font-weight="700" fill="#f1eaff" text-anchor="middle">Verdict</text><text class="t" x="915.0" y="148" font-size="12.5" fill="#b9a9d9" text-anchor="middle">clean or tampered</text>
  <g stroke="#c4b5fd" stroke-width="2" marker-end="url(#ah)"><line class="fl" x1="156" y1="129" x2="178" y2="129"/><line class="fl" x1="322" y1="129" x2="344" y2="129"/><line class="fl" x1="488" y1="129" x2="510" y2="129"/><line class="fl" x1="654" y1="129" x2="676" y2="129"/><line class="fl" x1="820" y1="129" x2="842" y2="129"/></g>
  <g class="m" font-size="12" fill="#8f7fb8" text-anchor="middle">
    <text x="417.0" y="204">tamper_v6.py</text>
    <text x="583.0" y="204">extract_v5.py</text>
    <text x="749.0" y="204">train_gnn_final.py</text>
    <text x="251.0" y="204">cnn.py</text>
  </g>
</svg>