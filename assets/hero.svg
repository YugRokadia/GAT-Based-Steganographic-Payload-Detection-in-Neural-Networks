<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-labelledby="t d">
  <title id="t">GAT-Based Steganographic Payload Detection in Neural Networks</title>
  <desc id="d">A graph of attention-weighted nodes next to the project title and the 97 percent detection accuracy badge.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#120b24"/><stop offset="1" stop-color="#241447"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".045"/></pattern>
  </defs>
  <style>
    .t{font-family:'Segoe UI',-apple-system,'Helvetica Neue',Arial,sans-serif}
    .m{font-family:SFMono-Regular,Consolas,Menlo,'DejaVu Sans Mono',monospace}
    @keyframes flow{to{stroke-dashoffset:-24}}
    .fl{stroke-dasharray:6 6;animation:flow 1s linear infinite}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    .pu{animation:pulse 2.4s ease-in-out infinite}.p2{animation-delay:-.8s}.p3{animation-delay:-1.6s}
    @media (prefers-reduced-motion:reduce){.fl,.pu{animation:none;opacity:1}}
  </style>
  <rect width="1000" height="340" rx="22" fill="url(#bg)"/>
  <rect width="1000" height="340" rx="22" fill="url(#grid)"/>
  <text class="t" x="60" y="74" font-size="13" font-weight="600" letter-spacing="3" fill="#c4b5fd">SECURITY × MACHINE LEARNING</text>
  <text class="t" x="60" y="134" font-size="52" font-weight="800" fill="#f1eaff">GAT Payload</text>
  <text class="t" x="60" y="190" font-size="52" font-weight="800" fill="#f1eaff">Detection</text>
  <text class="t" x="60" y="228" font-size="18" fill="#b9a9d9">Finding steganographic payloads hidden</text>
  <text class="t" x="60" y="252" font-size="18" fill="#b9a9d9">inside neural network weights.</text>
  <g class="t" font-size="14" font-weight="600" text-anchor="middle">
    <rect x="60"  y="276" width="96"  height="30" rx="15" fill="#a78bfa" fill-opacity=".16" stroke="#a78bfa" stroke-opacity=".6"/><text x="108" y="296" fill="#ddd6fe">PyTorch</text>
    <rect x="166" y="276" width="62"  height="30" rx="15" fill="#f472b6" fill-opacity=".14" stroke="#f472b6" stroke-opacity=".6"/><text x="197" y="296" fill="#fbcfe8">GAT</text>
    <rect x="238" y="276" width="104" height="30" rx="15" fill="#22d3ee" fill-opacity=".12" stroke="#22d3ee" stroke-opacity=".5"/><text x="290" y="296" fill="#67e8f9">CIFAR-10</text>
    <rect x="352" y="276" width="86"  height="30" rx="15" fill="#34d399" fill-opacity=".12" stroke="#34d399" stroke-opacity=".5"/><text x="395" y="296" fill="#6ee7b7">Python</text>
  </g>
  <rect x="590" y="50" width="350" height="240" rx="16" fill="#0e0820" fill-opacity=".55" stroke="#ffffff" stroke-opacity=".08"/>
  <line x1="650" y1="120" x2="735" y2="95" stroke="#a78bfa" stroke-width="3" stroke-opacity="0.7" stroke-linecap="round" class="pu p2"/><line x1="735" y1="95" x2="830" y2="125" stroke="#a78bfa" stroke-width="2" stroke-opacity="0.35" stroke-linecap="round"/><line x1="830" y1="125" x2="900" y2="100" stroke="#a78bfa" stroke-width="1.5" stroke-opacity="0.35" stroke-linecap="round"/><line x1="650" y1="120" x2="690" y2="190" stroke="#a78bfa" stroke-width="1.5" stroke-opacity="0.35" stroke-linecap="round"/><line x1="690" y1="190" x2="790" y2="205" stroke="#a78bfa" stroke-width="2.5" stroke-opacity="0.7" stroke-linecap="round" class="pu p2"/><line x1="790" y1="205" x2="875" y2="200" stroke="#a78bfa" stroke-width="1.5" stroke-opacity="0.35" stroke-linecap="round"/><line x1="735" y1="95" x2="760" y2="150" stroke="#f472b6" stroke-width="4" stroke-opacity="0.95" stroke-linecap="round" class="pu"/><line x1="760" y1="150" x2="830" y2="125" stroke="#a78bfa" stroke-width="2" stroke-opacity="0.35" stroke-linecap="round"/><line x1="760" y1="150" x2="790" y2="205" stroke="#f472b6" stroke-width="3.5" stroke-opacity="0.95" stroke-linecap="round" class="pu"/><line x1="690" y1="190" x2="760" y2="150" stroke="#a78bfa" stroke-width="2" stroke-opacity="0.35" stroke-linecap="round"/><line x1="830" y1="125" x2="875" y2="200" stroke="#a78bfa" stroke-width="1.5" stroke-opacity="0.35" stroke-linecap="round"/><line x1="650" y1="120" x2="760" y2="150" stroke="#a78bfa" stroke-width="1.5" stroke-opacity="0.35" stroke-linecap="round"/>
  <circle cx="650" cy="120" r="11" fill="#1c1138" stroke="#a78bfa" stroke-width="2"/><circle cx="735" cy="95" r="11" fill="#1c1138" stroke="#a78bfa" stroke-width="2"/><circle cx="830" cy="125" r="11" fill="#1c1138" stroke="#a78bfa" stroke-width="2"/><circle cx="900" cy="100" r="11" fill="#1c1138" stroke="#a78bfa" stroke-width="2"/><circle cx="690" cy="190" r="11" fill="#1c1138" stroke="#a78bfa" stroke-width="2"/><circle cx="790" cy="205" r="11" fill="#1c1138" stroke="#a78bfa" stroke-width="2"/><circle cx="875" cy="200" r="11" fill="#1c1138" stroke="#a78bfa" stroke-width="2"/><circle cx="760" cy="150" r="15" fill="#f472b6" stroke="#fbcfe8" stroke-width="2"/>
  <g class="t" text-anchor="middle">
    <rect x="625" y="236" width="280" height="38" rx="19" fill="#f472b6" fill-opacity=".14" stroke="#f472b6" stroke-opacity=".7"/>
    <text x="765" y="261" font-size="15" font-weight="700" fill="#fbcfe8">up to 97% detection accuracy</text>
  </g>
</svg>